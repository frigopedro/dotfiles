# tmux settings. Edit here or from the panel (prefix + .); prefix + r reloads.
# Format: set -g @ws-<key> "<value>". Missing keys fall back to the defaults.

# ── Plugins (TPM) ────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'off'

# ── Roots: where the project switcher looks ──────────────
set -g @ws-projects-dir "~/Desktop/Projects"
set -g @ws-extra-dirs "~/dotfiles:~/Downloads"
set -g @ws-repos-name "Repos"

# ── Layout of a new project session ──────────────────────
set -g @ws-editor-cmd "nvim ."
set -g @ws-side-pct "35"
set -g @ws-term-panes "4"
set -g @ws-win-dev "dev"
set -g @ws-win-term "term"

# ── Theme / status bar ───────────────────────────────────
set -g @ws-bar-bg "#3fb950"
set -g @ws-bar-fg "#0d1117"
set -g @ws-claude-status "on"
set -g @ws-clock-format "%H:%M %d-%b-%y"
