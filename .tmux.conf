# ── Plugins ──────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'off'

# ── General ──────────────────────────────────────────────
set -g mouse on
set -sg escape-time 0
set -g history-limit 50000
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:RGB"

# ── Status bar ───────────────────────────────────────────
set -g status-left-length 100
set -g status-left "#[bold,fg=black] #S #[default] | "
set -g status-right "#[fg=black]%H:%M %d-%b-%y"

# ── Project switcher (prefix + C-j) ──────────────────────
bind C-j display-popup -E "~/dotfiles/scripts/tmux-project-switcher.sh"

# ── Pane navigation ──────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind C-h select-pane -L
bind C-k select-pane -U
bind C-l select-pane -R
bind C-o switch-client -l
bind C-n next-window

# ── Config reload / paste ────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "config reloaded"
bind p paste-buffer                                             # prefix + p → paste

# ── Copy mode (vi) ───────────────────────────────────────
setw -g mode-keys vi

bind Escape copy-mode                                            # prefix + Escape → copy mode

bind-key -T copy-mode-vi v send-keys -X begin-selection         # start char selection
bind-key -T copy-mode-vi V send-keys -X select-line             # select whole line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle      # block selection
bind-key -T copy-mode-vi Y send-keys -X copy-line               # one-key "yy" → copy line
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ── TPM (must be the LAST line) ──────────────────────────
run '~/.tmux/plugins/tpm/tpm'
