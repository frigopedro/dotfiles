# ── Settings (plugins, project roots, layout, theme) ─────
# Edit tmux-settings.conf or use the panel (prefix + S). TPM follows this
# source-file to find the @plugin lines.
source-file ~/dotfiles/tmux-settings.conf

# ── General ──────────────────────────────────────────────
set -g mouse on
set -sg escape-time 0
set -g history-limit 50000
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:RGB"

# ── Status bar ───────────────────────────────────────────
# status-style / status-left / status-right are built from the @ws-bar-*,
# @ws-clock-format and @ws-claude-status settings (explicit hex colours: ANSI
# "black" is a mid-grey in the GitHub dark theme and vanishes on the green bar).
run-shell "~/dotfiles/scripts/tmux-settings.sh apply-theme"
set -g status-left-length 100

# Claude notifications: @claude_status (⚠ waiting / ✓ review / ● working
# counts) and per-window @claude_flag are set by claude-sessions.sh publish,
# which the Claude hooks run on every status change. The #(… publish) call in
# status-right prints nothing; it re-publishes every status-interval so
# sessions that died without a hook (kill -9) drop off.
set -g status-interval 5
set -g status-right-length 120
setw -g window-status-format        "#I:#W#{?window_flags,#{window_flags}, }#{?@claude_flag,#{@claude_flag} ,}"
setw -g window-status-current-format "#I:#W#{?window_flags,#{window_flags}, }#{?@claude_flag,#{@claude_flag} ,}"

# Looking at a pane clears its "✓ review" mark.
set -g focus-events on
set-hook -g pane-focus-in 'run-shell -b "~/dotfiles/scripts/claude-sessions.sh seen #{pane_id}"'

# ── Project switcher (prefix + C-j) ──────────────────────
# enter: open (or list worktrees if it has any) · ctrl-w: worktrees · ctrl-x: kill
bind C-j display-popup -E -w 85% -h 75% "~/dotfiles/scripts/tmux-project-switcher.sh"

# ── Claude session manager (prefix + a / prefix + C-a) ───
# Every running Claude Code instance, live preview, enter jumps to its pane.
bind a   display-popup -E -w 90% -h 85% "~/dotfiles/scripts/claude-sessions.sh"
bind C-a display-popup -E -w 90% -h 85% "~/dotfiles/scripts/claude-sessions.sh"

# ── Settings panel (prefix + S) ──────────────────────────
# Project roots, session layout, theme, plugins. Changes apply immediately.
bind S display-popup -E -w 85% -h 75% "~/dotfiles/scripts/tmux-settings.sh"

# ── Pane navigation ──────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind C-h select-pane -L
bind C-k select-pane -U
bind C-l select-pane -R
bind C-o switch-client -l
bind C-n next-window

# ── Config reload / paste ────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "config reloaded"
bind p paste-buffer                                             # prefix + p → paste

# ── Copy mode (vi) ───────────────────────────────────────
setw -g mode-keys vi

bind Escape copy-mode                                            # prefix + Escape → copy mode

bind-key -T copy-mode-vi v send-keys -X begin-selection         # start char selection
bind-key -T copy-mode-vi V send-keys -X select-line             # select whole line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle      # block selection
bind-key -T copy-mode-vi Y send-keys -X copy-line               # one-key "yy" → copy line
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ── TPM (must be the LAST line) ──────────────────────────
run '~/.tmux/plugins/tpm/tpm'
